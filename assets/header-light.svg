<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" role="img" aria-label="qewpew — Mathematics and Computer Science">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBFCFE"/>
      <stop offset="100%" stop-color="#EDF1F8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8250DF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#8250DF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#0969DA" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#0969DA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0969DA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0969DA" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8250DF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="880" height="230" rx="18"/></clipPath>
    <clipPath id="type"><rect id="typerect" x="56" y="60" width="246" height="80"><animate attributeName="width" calcMode="discrete"
               values="0;0;40;80;120;160;200;246" keyTimes="0;0.012;0.032;0.052;0.072;0.092;0.112;0.132"
               dur="9s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .caret { animation: blink 1.05s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .sub  { animation: fade 1.1s ease-out .85s both; }
    .tags { animation: fade 1.1s ease-out 1.15s both; }
    @keyframes fade {
      from { opacity: 0; transform: translateY(7px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .g { opacity: .3; animation: drift 11s ease-in-out infinite; }
    @keyframes drift {
      0%, 100% { transform: translateY(0px);   opacity: .16; }
      50%      { transform: translateY(-14px); opacity: .42; }
    }
    .g2 { animation-delay: -1.6s; } .g3 { animation-delay: -3.2s; }
    .g4 { animation-delay: -4.8s; } .g5 { animation-delay: -6.4s; }
    .g6 { animation-delay: -8.0s; } .g7 { animation-delay: -9.6s; }
    .blob { animation: swim 16s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .caret, .sub, .tags, .g, .blob, .blob2 { animation: none !important; }
      .sub, .tags { opacity: 1; } .g { opacity: .3; }
    }
    .blob2 { animation: swim 16s ease-in-out infinite reverse; animation-delay: -5s; }
    @keyframes swim {
      0%, 100% { transform: translate(0, 0)      scale(1);   }
      33%      { transform: translate(70px, 18px) scale(1.16); }
      66%      { transform: translate(-45px, -12px) scale(.92); }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="880" height="230" fill="url(#bg)"/>

    <g class="blob"><ellipse cx="720" cy="60" rx="230" ry="150" fill="url(#glow)"/></g>
    <g class="blob2"><ellipse cx="130" cy="200" rx="210" ry="140" fill="url(#glow2)"/></g>

    <g class="mono" fill="#0969DA" font-size="27" font-weight="600">
      <text class="g g2" x="640" y="70">&#8721;</text>
      <text class="g g3" x="712" y="140">&#8747;</text>
      <text class="g g4" x="792" y="88">&#8711;</text>
      <text class="g g5" x="676" y="196">&#963;</text>
      <text class="g g6" x="820" y="170">&#960;</text>
      <text class="g g7" x="586" y="140">&#956;</text>
      <text class="g"    x="758" y="42">&#948;</text>
    </g>

    <g clip-path="url(#type)">
      <text class="mono" x="56" y="118" font-size="66" font-weight="700" fill="#161B22" letter-spacing="1">qewpew</text>
    </g>
    <rect class="caret" id="caret" x="302" y="66" width="7" height="60" fill="#0969DA" rx="1.5">
      <animate attributeName="x" calcMode="discrete"
               values="56;56;96;136;176;216;256;302" keyTimes="0;0.012;0.032;0.052;0.072;0.092;0.112;0.132"
               dur="9s" repeatCount="indefinite"/>
    </rect>

    <text class="sans sub" x="58" y="160" font-size="19" font-weight="600" fill="#57606A">Mathematics &amp; Computer Science &#183; applied ML and statistics</text>

    <g class="mono tags" font-size="14" font-weight="600">
      <rect x="56"  y="180" width="104" height="27" rx="13.5" fill="#FFFFFF" stroke="#0969DA" stroke-opacity=".5"/>
      <text x="108" y="198" fill="#0969DA" text-anchor="middle">Python</text>
      <rect x="170" y="180" width="128" height="27" rx="13.5" fill="#FFFFFF" stroke="#8250DF" stroke-opacity=".5"/>
      <text x="234" y="198" fill="#8250DF" text-anchor="middle">statistics</text>
      <rect x="308" y="180" width="96" height="27" rx="13.5" fill="#FFFFFF" stroke="#BC4C00" stroke-opacity=".5"/>
      <text x="356" y="198" fill="#BC4C00" text-anchor="middle">ML</text>
      <rect x="414" y="180" width="126" height="27" rx="13.5" fill="#FFFFFF" stroke="#0969DA" stroke-opacity=".5"/>
      <text x="477" y="198" fill="#0969DA" text-anchor="middle">research</text>
    </g>

    <rect x="0" y="226" width="880" height="4" fill="url(#sweep)">
      <animate attributeName="x" values="-880;880" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="880" height="230" rx="18" fill="none" stroke="#D5DCE5" stroke-width="1.5"/>
  </g>
</svg>
